<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đua Ghe Ngo Trống Đồng 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥁</text></svg>">
  <style>
    :root {
      --gold: #e6be52;
      --gold-bright: #ffe38e;
      --bronze-dark: #0f2227;
      --cream: #f8eed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; user-select: none; }
    body { background: var(--bronze-dark); color: var(--cream); overflow: hidden; }
    #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; touch-action: none; }

    #rotate-hint {
      display: none; position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
      z-index: 12; background: rgba(230, 190, 82, 0.92); color: #102024;
      font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px;
      pointer-events: none; white-space: nowrap;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #rotate-hint { display: block; }
    }

    .overlay {
      position: fixed; inset: 0; z-index: 10;
      background: radial-gradient(circle at top, rgba(28, 66, 74, 0.94), rgba(10, 22, 26, 0.97));
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; overflow-y: auto;
    }
    .card {
      background: linear-gradient(180deg, rgba(28, 58, 66, 0.96), rgba(17, 36, 41, 0.98));
      border: 2px solid var(--gold); border-radius: 14px;
      padding: 16px; width: 100%; max-width: 540px; text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.7);
    }
    h2 { color: var(--gold-bright); font-size: 19px; letter-spacing: 0.4px; }
    input, select, button {
      width: 100%; padding: 9px 11px; margin-top: 7px; border-radius: 8px;
      border: 1px solid var(--gold); font-size: 13px;
    }
    input, select { background: #0e1f23; color: var(--cream); }
    button {
      background: linear-gradient(180deg, #f3cf68, #cfa132);
      color: #102024; font-weight: 800; cursor: pointer; transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: linear-gradient(180deg, #2b4d54, #1d363c); color: var(--cream); }

    #player-list {
      margin-top: 8px; max-height: 130px; overflow-y: auto; text-align: left;
      background: #0e1f23; padding: 7px 9px; border-radius: 8px; border: 1px solid #3a626a; font-size: 12px;
    }
    .player-item { padding: 3px 0; border-bottom: 1px dashed #244046; display: flex; justify-content: space-between; gap: 6px; }
    .conflict-badge { color: #ff8278; font-weight: 700; }

    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
    #top-bar {
      position: absolute; top: 8px; left: 10px;
      width: min(470px, 47vw);
      background: rgba(13, 30, 35, 0.88); backdrop-filter: blur(5px);
      padding: 6px 10px; border-radius: 11px; border: 1.5px solid var(--gold);
    }
    #scoreboard { display: flex; justify-content: space-between; gap: 4px; font-size: 11px; font-weight: 800; flex-wrap: wrap; }
    #my-badge { margin-top: 2px; font-size: 11px; color: var(--gold-bright); font-weight: 700; }
    #role-brief {
      margin-top: 3px; font-size: 10.5px; line-height: 1.3; color: #e2f2f3;
      background: rgba(255, 227, 142, 0.06); border-radius: 6px; padding: 3px 6px;
    }
    #cam-bar { display: flex; gap: 4px; align-items: center; margin-top: 5px; pointer-events: auto; flex-wrap: wrap; }
    .cam-btn {
      width: auto; margin-top: 0; padding: 3px 7px; font-size: 10.5px;
      background: #213e45; color: var(--cream); border: 1px solid #759ba3; border-radius: 6px;
    }
    .cam-btn.active { background: var(--gold); color: #102024; border-color: #fff3c4; }

    #team-banner {
      position: absolute; top: 8px; right: 10px;
      background: linear-gradient(90deg, #b87b14, #ffe38e, #b87b14);
      color: #132124; font-weight: 900; font-size: 11.5px;
      padding: 4px 12px; border-radius: 999px; display: none; white-space: nowrap;
    }
    #feed {
      position: absolute; top: 34px; right: 10px;
      font-size: 10.5px; background: rgba(190, 52, 38, 0.92); color: #fff;
      padding: 3px 10px; border-radius: 999px; display: none; white-space: nowrap;
    }

    #countdown {
      position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
      font-size: 78px; font-weight: 900; color: var(--gold-bright);
      text-shadow: 0 0 25px rgba(230, 190, 82, 0.85); background: rgba(0,0,0,0.42);
    }

    #role-panel {
      position: absolute; bottom: 10px; right: 10px;
      width: min(470px, 49vw);
      background: linear-gradient(180deg, rgba(24, 47, 53, 0.94), rgba(14, 29, 34, 0.96));
      border: 2px solid var(--gold); border-radius: 12px; padding: 9px 11px;
      pointer-events: auto; text-align: center;
    }
    .btn-group { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
    .btn-group button { margin-top: 0; padding: 9px 6px; font-size: 12px; }

    @media (orientation: portrait) {
      #top-bar { top: 26px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 520px; }
      #team-banner { top: 122px; left: 50%; right: auto; transform: translateX(-50%); }
      #feed { top: 146px; left: 50%; right: auto; transform: translateX(-50%); }
      #role-panel { bottom: 8px; left: 50%; right: auto; transform: translateX(-50%); width: 95%; max-width: 520px; }
    }

    .rank-box {
      margin-top: 8px; max-height: 145px; overflow-y: auto; text-align: left;
      background: #0e1f23; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a626a; font-size: 12px;
    }
    .rank-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #244046; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="rotate-hint">↻ Xoay ngang màn hình để quan sát rộng nhất</div>

  <!-- 1. SẢNH CHỜ -->
  <div id="lobby" class="overlay">
    <div class="card">
      <h2>🥁 ĐUA GHE NGO TRỐNG ĐỒNG</h2>
      <p style="font-size: 11.5px; opacity: 0.85; margin-top: 2px;">4 Ghe × 5 Vai Trò · Kéo 360° · Xếp hạng đóng góp</p>

      <input id="player-name" placeholder="Tên hiển thị..." maxlength="14" />
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <select id="pref-boat">
          <option value="0">Ghe 1: Chim Lạc</option>
          <option value="1">Ghe 2: Giao Long</option>
          <option value="2">Ghe 3: Rùa Vàng</option>
          <option value="3">Ghe 4: Mặt Trời</option>
        </select>
        <select id="pref-role">
          <option value="rower_left">🚣 Tay Chèo Trái</option>
          <option value="rower_right">🚣 Tay Chèo Phải</option>
          <option value="drummer">🥁 Tay Trống</option>
          <option value="scholar">📜 Đáp Hội</option>
          <option value="saboteur">💣 Kẻ Phá Đám</option>
        </select>
      </div>
      <button id="register-btn">ĐĂNG KÝ & BẬT ÂM THANH</button>

      <div id="player-list">Đang chờ người chơi...</div>
      <button id="host-start-btn" class="secondary">🎲 QUAY SỐ CHIA VAI & BẮT ĐẦU</button>
    </div>
  </div>

  <!-- 2. ĐẾM NGƯỢC & HUD -->
  <div id="countdown">3</div>
  <div id="hud">
    <div id="top-bar">
      <div id="scoreboard">
        <span id="score-0">G1: 0m</span>
        <span id="score-1">G2: 0m</span>
        <span id="score-2">G3: 0m</span>
        <span id="score-3">G4: 0m</span>
      </div>
      <div id="my-badge">Đang phân vai...</div>
      <div id="role-brief"></div>
      <div id="cam-bar">
        <button class="cam-btn active" data-cam="mine">🎥 Ghe Mình</button>
        <button class="cam-btn" data-cam="0">G1</button>
        <button class="cam-btn" data-cam="1">G2</button>
        <button class="cam-btn" data-cam="2">G3</button>
        <button class="cam-btn" data-cam="3">G4</button>
        <span id="cam-deg" style="font-size:10px; opacity:0.8; margin-left:auto;">0°</span>
      </div>
    </div>
    <div id="team-banner"></div>
    <div id="feed"></div>
    <div id="role-panel"></div>
  </div>

  <!-- 3. KẾT QUẢ & XẾP HẠNG ĐÓNG GÓP -->
  <div id="podium" class="overlay" style="display: none;">
    <div class="card">
      <h2>🏆 KẾT QUẢ TRẬN ĐUA</h2>
      <div id="ranking-list" class="rank-box" style="max-height:110px;"></div>
      <h3 style="font-size:14px; color:var(--gold-bright); margin-top:10px; text-align:left;">⭐ XẾP HẠNG ĐÓNG GÓP CÁ NHÂN</h3>
      <div id="contribution-list" class="rank-box"></div>
      <button id="reset-room-btn">🔄 VÁN MỚI</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
