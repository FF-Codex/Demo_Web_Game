<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đua Ghe Ngo Trống Đồng 3D - 20 Người Chơi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥁</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; user-select: none; }
    body { background: #0f2429; color: #f7ebd2; overflow: hidden; }
    #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Màn hình Sảnh Chờ & Kết Thúc */
    .overlay {
      position: fixed; inset: 0; z-index: 10; background: rgba(12, 26, 30, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; overflow-y: auto;
    }
    .card {
      background: #1d353a; border: 2px solid #e0b84c; border-radius: 14px;
      padding: 18px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.65);
    }
    h2 { color: #ffd97d; letter-spacing: 0.5px; font-size: 20px; }
    input, select, button {
      width: 100%; padding: 10px 12px; margin-top: 8px; border-radius: 8px;
      border: 1px solid #e0b84c; font-size: 14px;
    }
    input, select { background: #102024; color: #f7ebd2; }
    button { background: #e0b84c; color: #122124; font-weight: 700; cursor: pointer; transition: transform 0.12s, filter 0.15s; }
    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(0.96); }
    button.secondary { background: #2d4c52; color: #f7ebd2; }

    #player-list {
      margin-top: 10px; max-height: 150px; overflow-y: auto; text-align: left;
      background: #102024; padding: 8px 10px; border-radius: 8px; border: 1px solid #3c6269; font-size: 12px;
    }
    .player-item { padding: 4px 0; border-bottom: 1px dashed #264247; display: flex; justify-content: space-between; gap: 6px; }
    .conflict-badge { color: #ff7b72; font-weight: 700; }

    /* HUD trong lúc đua */
    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
    #top-bar {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 96%; max-width: 680px;
      background: rgba(14, 30, 34, 0.86); backdrop-filter: blur(4px);
      padding: 7px 12px; border-radius: 12px; border: 1px solid #e0b84c;
    }
    #scoreboard { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; flex-wrap: wrap; }
    #my-badge { margin-top: 3px; font-size: 12px; color: #ffd97d; text-align: center; }
    #role-brief {
      margin-top: 4px; font-size: 11px; line-height: 1.35; color: #dceeed;
      background: rgba(255, 255, 255, 0.05); border-radius: 7px; padding: 4px 8px; text-align: left;
    }

    #cam-bar {
      display: flex; gap: 4px; justify-content: center; align-items: center;
      margin-top: 6px; pointer-events: auto; flex-wrap: wrap;
    }
    .cam-btn {
      width: auto; margin-top: 0; padding: 4px 8px; font-size: 11px;
      background: #234046; color: #f7ebd2; border: 1px solid #7d9fa6; border-radius: 6px;
    }
    .cam-btn.active { background: #e0b84c; color: #122124; border-color: #fff; }

    /* Banner hiệu ứng đồng đội ("TRỐNG TỐT!", buff, cảnh báo) */
    #team-banner {
      position: absolute; top: 108px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #b87b14, #ffd97d, #b87b14);
      color: #162224; font-weight: 900; font-size: 13px; letter-spacing: 0.4px;
      padding: 5px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(255, 217, 125, 0.45);
      display: none; white-space: nowrap;
    }
    #feed {
      position: absolute; top: 136px; left: 50%; transform: translateX(-50%);
      font-size: 11px; background: rgba(186, 52, 38, 0.92); color: #fff; padding: 3px 11px;
      border-radius: 999px; display: none; white-space: nowrap;
    }

    /* Đếm ngược xuất phát */
    #countdown {
      position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
      font-size: 82px; font-weight: 900; color: #ffd97d; text-shadow: 0 0 25px #e0b84c; background: rgba(0,0,0,0.42);
    }

    /* Khu vực điều khiển vai trò */
    #role-panel {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      width: 96%; max-width: 560px; background: rgba(23, 43, 48, 0.92);
      border: 2px solid #e0b84c; border-radius: 14px; padding: 11px 13px;
      pointer-events: auto; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
    .btn-group button { margin-top: 0; padding: 11px 8px; font-size: 13px; }

    /* Bố cục tối ưu màn hình ngang (Landscape / Màn hình rộng) */
    @media (orientation: landscape) and (max-height: 540px) {
      #top-bar { top: 6px; left: 10px; transform: none; width: 46%; max-width: 440px; padding: 6px 9px; }
      #role-brief { font-size: 10px; padding: 3px 6px; }
      #team-banner { top: 8px; left: auto; right: 10px; transform: none; font-size: 11px; }
      #feed { top: 34px; left: auto; right: 10px; transform: none; font-size: 10px; }
      #role-panel {
        bottom: 8px; left: auto; right: 10px; transform: none;
        width: 48%; max-width: 460px; padding: 8px 10px;
      }
      .btn-group button { padding: 8px 6px; font-size: 12px; }
    }

    @media (min-width: 900px) and (orientation: landscape) {
      #role-panel {
        bottom: 14px; left: auto; right: 18px; transform: none;
        width: 420px; max-width: 44vw;
      }
      #top-bar { left: 18px; transform: none; width: auto; min-width: 460px; }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 1. SẢNH CHỜ -->
  <div id="lobby" class="overlay">
    <div class="card">
      <h2>🥁 ĐUA GHE NGO TRỐNG ĐỒNG</h2>
      <p style="font-size: 12px; opacity: 0.85; margin-top: 3px;">4 Ghe × 5 Vai Trò — Phối hợp nhịp chèo, trống đồng, linh khí & phá đám</p>

      <input id="player-name" placeholder="Nhập tên hiển thị của bạn..." maxlength="14" />
      <select id="pref-boat">
        <option value="0">Ghe 1: Chim Lạc (Vàng Kim)</option>
        <option value="1">Ghe 2: Giao Long (Đỏ Son)</option>
        <option value="2">Ghe 3: Rùa Vàng (Ngọc Bích)</option>
        <option value="3">Ghe 4: Mặt Trời (Cam Lửa)</option>
      </select>
      <select id="pref-role">
        <option value="rower_left">🚣 Tay Chèo Trái</option>
        <option value="rower_right">🚣 Tay Chèo Phải</option>
        <option value="drummer">🥁 Tay Trống</option>
        <option value="scholar">📜 Đáp Hội</option>
        <option value="saboteur">💣 Kẻ Phá Đám</option>
      </select>
      <button id="register-btn">ĐĂNG KÝ NGUYỆN VỌNG & BẬT ÂM THANH</button>

      <div id="player-list">Đang chờ người chơi vào sảnh...</div>
      <button id="host-start-btn" class="secondary" style="margin-top: 10px;">🎲 HOST: QUAY SỐ CHIA VAI & XUẤT PHÁT</button>
    </div>
  </div>

  <!-- 2. ĐẾM NGƯỢC & HUD ĐUA -->
  <div id="countdown">3</div>
  <div id="hud">
    <div id="top-bar">
      <div id="scoreboard">
        <span id="score-0">Ghe 1: 0m</span>
        <span id="score-1">Ghe 2: 0m</span>
        <span id="score-2">Ghe 3: 0m</span>
        <span id="score-3">Ghe 4: 0m</span>
      </div>
      <div id="my-badge">Đang phân vai...</div>
      <div id="role-brief"></div>
      <div id="cam-bar">
        <button class="cam-btn active" data-cam="mine">🎥 Ghe Mình</button>
        <button class="cam-btn" data-cam="left">◀ Liếc Trái</button>
        <button class="cam-btn" data-cam="right">Liếc Phải ▶</button>
        <button class="cam-btn" data-cam="0">G1</button>
        <button class="cam-btn" data-cam="1">G2</button>
        <button class="cam-btn" data-cam="2">G3</button>
        <button class="cam-btn" data-cam="3">G4</button>
      </div>
    </div>
    <div id="team-banner"></div>
    <div id="feed"></div>
    <div id="role-panel"></div>
  </div>

  <!-- 3. KẾT QUẢ CUỐI TRẬN -->
  <div id="podium" class="overlay" style="display: none;">
    <div class="card">
      <h2>🏆 KẾT QUẢ LỄ HỘI ĐUA GHE</h2>
      <div id="ranking-list" style="margin: 14px 0; text-align: left; line-height: 1.8;"></div>
      <button id="reset-room-btn">🔄 CHƠI VÁN MỚI (VỀ SẢNH CHỜ)</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
