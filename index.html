<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đua Ghe Ngo Trống Đồng 3D - Demo 20 Người</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; user-select: none; }
    body { background: #1a120b; color: #f5deb3; overflow: hidden; }
    #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Màn hình Sảnh Chờ & Kết Thúc */
    .overlay {
      position: fixed; inset: 0; z-index: 10; background: rgba(20, 13, 7, 0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-y: auto;
    }
    .card {
      background: #2c1e12; border: 2px solid #d4af37; border-radius: 14px;
      padding: 20px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h2 { color: #ffd27d; letter-spacing: 0.5px; }
    input, select, button {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px;
      border: 1px solid #d4af37; font-size: 15px;
    }
    input, select { background: #1a120b; color: #f5deb3; }
    button { background: #d4af37; color: #1a120b; font-weight: bold; cursor: pointer; transition: 0.15s; }
    button:active { transform: scale(0.96); }
    button.secondary { background: #4a3520; color: #f5deb3; }

    /* Danh sách người đăng ký trong sảnh */
    #player-list {
      margin-top: 12px; max-height: 180px; overflow-y: auto; text-align: left;
      background: #1a120b; padding: 10px; border-radius: 8px; border: 1px solid #5c4328; font-size: 13px;
    }
    .player-item { padding: 4px 0; border-bottom: 1px dashed #3d2b18; display: flex; justify-content: space-between; }
    .conflict-badge { color: #ff6b6b; font-weight: bold; }

    /* HUD trong lúc đua */
    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
    #top-bar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 600px;
      background: rgba(26, 18, 11, 0.88); padding: 8px 12px; border-radius: 12px; border: 1px solid #d4af37;
    }
    #scoreboard { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; }
    #my-badge { margin-top: 4px; font-size: 12px; color: #ffd27d; text-align: center; }

    /* Đếm ngược xuất phát */
    #countdown {
      position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
      font-size: 84px; font-weight: 900; color: #ffd27d; text-shadow: 0 0 25px #d4af37; background: rgba(0,0,0,0.45);
    }

    /* Khu vực điều khiển vai trò phía dưới */
    #role-panel {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 520px; background: rgba(44, 30, 18, 0.94);
      border: 2px solid #d4af37; border-radius: 14px; padding: 14px; pointer-events: auto; text-align: center;
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .btn-group button { margin-top: 0; padding: 14px 8px; font-size: 14px; }
    #feed {
      position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
      font-size: 12px; background: rgba(192, 57, 43, 0.9); color: #fff; padding: 4px 12px;
      border-radius: 20px; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 1. SẢNH CHỜ ĐĂNG KÝ NGUYỆN VỌNG -->
  <div id="lobby" class="overlay">
    <div class="card">
      <h2>🥁 ĐUA GHE NGO TRỐNG ĐỒNG</h2>
      <p style="font-size: 12px; opacity: 0.85; margin-top: 4px;">Chọn nguyện vọng — Trùng ghế sẽ quay số ngẫu nhiên!</p>
      
      <input id="player-name" placeholder="Nhập tên hiển thị của bạn..." maxlength="14" />
      <select id="pref-boat">
        <option value="0">Ghe 1: Chim Lạc (Vàng Đồng)</option>
        <option value="1">Ghe 2: Giao Long (Đỏ Son)</option>
        <option value="2">Ghe 3: Rùa Vàng (Xanh Ngọc)</option>
        <option value="3">Ghe 4: Mặt Trời (Cam Đất)</option>
      </select>
      <select id="pref-role">
        <option value="rower_left">🚣 Tay Chèo Trái (Phối hợp nhịp)</option>
        <option value="rower_right">🚣 Tay Chèo Phải (Phối hợp nhịp)</option>
        <option value="drummer">🥁 Tay Trống (Rhythm 3 làn)</option>
        <option value="scholar">📜 Đáp Hội (Vua Tiếng Việt)</option>
        <option value="saboteur">💣 Kẻ Phá Đám (Ném vật phẩm 3D)</option>
      </select>
      <button id="register-btn">ĐĂNG KÝ NGUYỆN VỌNG & BẬT ÂM THANH</button>

      <div id="player-list">Đang chờ người chơi vào sảnh...</div>
      <button id="host-start-btn" class="secondary" style="margin-top: 12px;">🎲 HOST: QUAY SỐ CHIA VAI & BẮT ĐẦU</button>
    </div>
  </div>

  <!-- 2. ĐẾM NGƯỢC & HUD ĐUA -->
  <div id="countdown">3</div>
  <div id="hud">
    <div id="top-bar">
      <div id="scoreboard">
        <span id="score-0">Ghe 1: 0m</span>
        <span id="score-1">Ghe 2: 0m</span>
        <span id="score-2">Ghe 3: 0m</span>
        <span id="score-3">Ghe 4: 0m</span>
      </div>
      <div id="my-badge">Đang phân vai...</div>
    </div>
    <div id="feed"></div>
    <div id="role-panel"></div>
  </div>

  <!-- 3. MÀN HÌNH VINH DANH CUỐI TRẬN -->
  <div id="podium" class="overlay" style="display: none;">
    <div class="card">
      <h2>🏆 KẾT QUẢ LỄ HỘI ĐUA GHE</h2>
      <div id="ranking-list" style="margin: 14px 0; text-align: left; line-height: 1.8;"></div>
      <button id="reset-room-btn">🔄 CHƠI VÁN MỚI (VỀ SẢNH CHỜ)</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
